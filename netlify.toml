[build]
  publish = "."
  functions = "netlify/functions"

# www -> apex, matching the canonical host everywhere else on the site.
# robots.txt, sitemap.xml and every <link rel="canonical"> already point at
# the bare domain (see the comment above that tag in index.html) -- but until
# now www.stylestar.app served the whole site directly with no redirect at
# all, so Google saw two live copies of every page. This has to come FIRST,
# before the path-based rewrites below, or a hit on www.stylestar.app/faq
# would match the /faq rewrite first and rewrite in place without ever
# changing the host.
[[redirects]]
  from = "https://www.stylestar.app/*"
  to = "https://stylestar.app/:splat"
  status = 301
  force = true

# Real URLs for the pages that need one.
#
# Style Star is a single-page app: every "page" is a hidden div that JavaScript
# reveals, so none of them had an address of their own. That mattered most for
# the legal pages, because every affiliate program's application form has a
# required "Privacy Policy URL" field and several of them fetch that URL to
# check it loads.
#
# These are rewrites (status 200), not redirects, so the address bar keeps the
# pretty path while index.html is served. The router in index.html then opens
# the matching screen. Nothing is duplicated -- there is still exactly one copy
# of the policy text, and a reviewer sees the real designed page.
#
# WARNING: once one of these URLs has been submitted to an affiliate network,
# never change its path.
[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/story"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/index.html"
  status = 200

# /contact exists because every affiliate network's application form asks for
# a contact URL, and reviewers check that a real person can be reached.
[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

# Style Journal, her long-tail SEO articles (2026-08-26, her ask). Nested under
# /journal/ rather than flat like the pages above, because this is meant to
# grow into several articles and they all deserve one consistent home. A
# WILDCARD, the same shape as /list/* below, so a new article never needs a
# netlify.toml edit -- see JOURNAL_ARTICLES in index.html, which is the only
# place a new article's slug has to be written. Same WARNING as every path
# above: once an article's URL is indexed, it never moves.
[[redirects]]
  from = "/journal"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/journal/*"
  to = "/index.html"
  status = 200

# /results opens the Style Portrait on a device that has one saved (results
# live in the browser + behind the emailed token, so the path itself carries
# nothing personal; a visitor without saved results lands on the welcome).
[[redirects]]
  from = "/results"
  to = "/index.html"
  status = 200

# The shared wishlist: /list/<token> is her registry page, the one she sends to
# somebody who wants to buy from it. The token is the credential, so the path is
# dynamic and the router in index.html reads it off location.pathname rather
# than matching a fixed path.
#
# WARNING: the same rule as the pages above -- once a woman has sent one of
# these links to another person, this path can never change, or every link
# already out in the world stops working.
[[redirects]]
  from = "/list/*"
  to = "/index.html"
  status = 200

# The shared wishlist's link preview. iMessage and friends read the RAW HTML and
# never run JavaScript, so /list/<token> previewed with the homepage's og: tags
# and every shared wishlist looked exactly like sharing the whole app (her
# catch, 2026-08-21). This rewrites the title and description for that path
# alone -- no other page passes through it.
[[edge_functions]]
  path = "/list/*"
  function = "list-preview"

# Per-route titles for the real pages (2026-08-25, her ask). Until now every
# one of these rewrites served the identical raw <title> and
# <meta name="description"> as the homepage, which is invisible to a search
# engine or a link-preview bot -- neither runs the JavaScript that would
# otherwise tell them apart. Separate blocks, not one glob, because the paths
# share no common prefix. See netlify/edge-functions/page-titles.js.
[[edge_functions]]
  path = "/story"
  function = "page-titles"

[[edge_functions]]
  path = "/faq"
  function = "page-titles"

[[edge_functions]]
  path = "/contact"
  function = "page-titles"

[[edge_functions]]
  path = "/privacy"
  function = "page-titles"

[[edge_functions]]
  path = "/terms"
  function = "page-titles"

# The Journal DOES get a wildcard here (unlike the five above) because it is
# the one family meant to grow -- see JOURNAL_ARTICLES in index.html and the
# PAGES map in page-titles.js. A new article needs no netlify.toml edit.
[[edge_functions]]
  path = "/journal"
  function = "page-titles"

[[edge_functions]]
  path = "/journal/*"
  function = "page-titles"

# Instagram bio short links (2026-08-30, her catch). A UTM-tagged link
# (?utm_source=instagram&utm_campaign=...) is what lets Plausible tell her
# four Instagram accounts apart -- but Instagram's own bio display truncates
# ANY link that carries a query string down to "domain/?", showing nothing
# after the "?" no matter how long or short the real link is. Pasted into a
# bio it reads as a broken, unfinished link, even though it works perfectly.
#
# These are real 301s (not the 200 rewrites above), because the point here is
# the opposite of those: the address bar SHOULD change, to the fully tagged
# URL, once the visitor has already tapped through. Instagram only ever
# displays the short path itself, which carries no query string and so can
# never show a "?".
#
# WARNING: once one of these is pasted into a live bio, don't repoint it to a
# different destination without updating the bio too -- and never delete one
# outright while it might still be sitting in someone's Instagram profile.
[[redirects]]
  from = "/ig"
  to = "/?utm_source=instagram&utm_campaign=brand"
  status = 301

[[redirects]]
  from = "/ig-personal"
  to = "/?utm_source=instagram&utm_campaign=personal"
  status = 301

[[redirects]]
  from = "/ig-pro"
  to = "/?utm_source=instagram&utm_campaign=stylist"
  status = 301

[[redirects]]
  from = "/ig-3d"
  to = "/?utm_source=instagram&utm_campaign=3d"
  status = 301
