<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400;src:url(fonts/og1.woff2) format('woff2');}
@font-face{font-family:'DM Serif Display';font-style:normal;font-weight:400;src:url(fonts/og6.woff2) format('woff2');}
@font-face{font-family:'DM Serif Display';font-style:italic;font-weight:400;src:url(fonts/og3.woff2) format('woff2');}
@font-face{font-family:'Jost';font-style:normal;font-weight:400;src:url(fonts/og8.woff2) format('woff2');}
@font-face{font-family:'Jost';font-style:normal;font-weight:600;src:url(fonts/og8.woff2) format('woff2');}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#FBFAF7;font-family:'DM Sans',sans-serif;overflow:hidden}
.card{width:1200px;height:630px;background:#FBFAF7;border:1px solid #D8C285;position:relative;overflow:hidden}
.top{position:absolute;top:40px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:baseline}
.lbl-l{font-family:'Jost';font-weight:600;font-size:19px;letter-spacing:.1em;color:#C89A2C;text-transform:uppercase}
.lbl-r{font-family:'Jost';font-weight:400;font-size:19px;letter-spacing:.06em;color:#a39c8e;text-transform:uppercase}
.headline{position:absolute;top:112px;left:64px;right:64px;font-family:'DM Serif Display',serif;font-weight:400;font-size:58px;color:#1a1a1a;line-height:1.1}
.headline i{font-style:italic;color:#a9791b}
.sub{position:absolute;top:234px;left:64px;right:64px;font-family:'DM Sans',sans-serif;font-weight:500;font-size:31px;color:#6f6a63}
.bands{position:absolute;top:326px;left:0;right:0;bottom:0;display:flex}
.band{flex:1}
</style></head>
<body>
<div class="card">
  <div class="top"><span class="lbl-l">Style Star &middot; Style Journal</span><span class="lbl-r">stylestar.app</span></div>
  <h1 class="headline">Fall colors that work at <i>90 degrees</i></h1>
  <div class="sub">No heavy fabrics. No coats. Just deeper, richer colors.</div>
  <div class="bands">
    <div class="band" style="background:#3E2A1E"></div>
    <div class="band" style="background:#6E2439"></div>
    <div class="band" style="background:#B5602E"></div>
    <div class="band" style="background:#C6A472"></div>
    <div class="band" style="background:#7A7D4A"></div>
    <div class="band" style="background:#2C4A3A"></div>
    <div class="band" style="background:#1E2D45"></div>
    <div class="band" style="background:#EDE7DC"></div>
  </div>
</div>
</body></html>
