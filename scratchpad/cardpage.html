<!doctype html><meta charset="utf-8">
<link href="/scratchpad/fonts/gf.css" rel="stylesheet">
<style>body{margin:0;background:#333}canvas{display:block}</style>
<canvas id="card" width="1080" height="1350"></canvas>
<script>
document.fonts.ready.then(()=>Promise.all([
  document.fonts.load('72px "DM Serif Display"'),
  document.fonts.load('italic 400 40px "Lora"'),
  document.fonts.load('600 30px "Jost"'),
  document.fonts.load('500 30px "DM Sans"')
])).then(()=>{window.__fontsReady=true});

const W=1080,H=1350;
const ctx=document.getElementById('card').getContext('2d');

/* ── her palette, straight from the app ───────────────────────────────── */
const LACQUER='#1a1a1a';                       // ink + filled controls
const GOLDLEAF=['#FEEF98','#F6CE3E','#E4B02E','#F3DC8B'];  // the wb-chip ramp
const MARQUEE_LETTER='#F2D889', MARQUEE_RIM='#C99A2C';
const PAPER='#FBFAF7';                         // the welcome mirror's paper
const INK='#1a1a1a', SOFTINK='#4a463e';
const GOLD='#D8A52E';

/* ── the woman on the card: Ashley's real archetype, from the group chat ── */
const D={
  name:'Ashley',
  arch:'The Statement Maker',
  notes:['The Bold Expressionist','The Modern Trendsetter'],
  motto:'Ashley, you walk in and the room adjusts; your confidence is the accessory.'
};

/* ── helpers ─────────────────────────────────────────────────────────── */
function diag(x0,y0,x1,y1,stops){
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c));return g;
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
// Fit to width by SHRINKING, never by wrapping mid-name: an archetype name is one
// unit ("The Polished Professional" is the 25-char worst case).
function fitFont(text,face,start,min,maxW){
  let s=start;ctx.font=s+'px '+face;
  while(ctx.measureText(text).width>maxW&&s>min){s--;ctx.font=s+'px '+face;}
  return s;
}
function wrap(text,maxW){
  const words=text.split(' ');const lines=[];let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;
  }
  if(line)lines.push(line);return lines;
}
function star(cx,cy,r,fill){
  ctx.save();ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.42:r;
    ctx[i?'lineTo':'moveTo'](cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);
  }
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.restore();
}
// The silver-outside / gold-inside frame is the card family's existing signature.
// Kept identical across all three so she is judging the FACE, not the frame.
function frame(faceFill){
  const T=20;
  ctx.fillStyle=diag(0,0,W,H,['#FFFFFF','#C6CACE','#8C9298','#F2F4F6','#9AA0A6','#DFE2E5','#FFFFFF']);
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle=diag(T,T,W-T,H-T,['#EED89A','#D8A93E','#B8831F','#F3E3A6','#C89A2C','#9C7519']);
  ctx.fillRect(T,T,W-2*T,H-2*T);
  ctx.fillStyle=faceFill;ctx.fillRect(2*T,2*T,W-4*T,H-4*T);
  return 2*T;
}
// Small brand mark. NOTE: typed, so it takes the capital — the 2026-08-22 rule
// (Style Star is capitalised everywhere the name is TYPED; only the drawn logo
// image keeps the lowercase s).
function brandmark(y,color){
  ctx.textAlign='center';
  star(W/2,y-34,19,color);
  ctx.fillStyle=color;
  ctx.font='600 27px "Jost", sans-serif';
  ctx.letterSpacing='7px';
  ctx.fillText('STYLE STAR',W/2,y+18);
  ctx.letterSpacing='0px';
}
function foot(colorFaint,colorStrong){
  ctx.textAlign='center';
  ctx.fillStyle=colorFaint;
  ctx.font='italic 400 34px "Lora", serif';
  ctx.fillText('What’s yours?',W/2,H-152);
  ctx.fillStyle=colorStrong;
  ctx.font='44px "DM Serif Display", serif';
  ctx.fillText('stylestar.app',W/2,H-88);
}

/* ══ A — THE MARQUEE: her archetype up in lights ═══════════════════════ */
function optA(){
  frame(LACQUER);
  const face=ctx.createRadialGradient(W/2,470,80,W/2,560,900);
  face.addColorStop(0,'#2b2620');face.addColorStop(.5,'#1c1814');face.addColorStop(1,'#100e0b');
  ctx.fillStyle=face;ctx.fillRect(40,40,W-80,H-80);

  brandmark(150,'#C9B37A');

  ctx.textAlign='center';
  ctx.fillStyle='#E8E2D2';
  ctx.font='italic 400 46px "Lora", serif';
  ctx.fillText('I’m',W/2,442);

  // the name, in lights
  const bx=92,bw=W-184,by=488,bh=300;
  ctx.fillStyle='rgba(0,0,0,.45)';rrect(bx,by,bw,bh,26);ctx.fill();
  ctx.strokeStyle=MARQUEE_RIM;ctx.lineWidth=3;rrect(bx,by,bw,bh,26);ctx.stroke();

  // marquee bulbs around the rim
  const bulbs=[];const step=54;
  for(let x=bx+34;x<bx+bw-20;x+=step){bulbs.push([x,by]);bulbs.push([x,by+bh]);}
  for(let y=by+40;y<by+bh-20;y+=step){bulbs.push([bx,y]);bulbs.push([bx+bw,y]);}
  bulbs.forEach(([x,y])=>{
    const g=ctx.createRadialGradient(x,y,0,x,y,17);
    g.addColorStop(0,'rgba(255,248,214,.95)');g.addColorStop(.45,'rgba(242,216,137,.55)');
    g.addColorStop(1,'rgba(242,216,137,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,17,0,7);ctx.fill();
    ctx.fillStyle='#FFF6D2';ctx.beginPath();ctx.arc(x,y,5.2,0,7);ctx.fill();
  });

  const words=D.arch.split(' ');
  const l1=words[0], l2=words.slice(1).join(' ');
  ctx.fillStyle='#CBB98C';
  ctx.font='46px "DM Serif Display", serif';
  ctx.fillText(l1,W/2,by+108);
  const fs=fitFont(l2,'"DM Serif Display", serif',108,58,bw-96);
  ctx.font=fs+'px "DM Serif Display", serif';
  ctx.fillStyle=diag(W/2-300,by+140,W/2+300,by+250,GOLDLEAF);
  ctx.shadowColor='rgba(245,220,140,.5)';ctx.shadowBlur=34;
  ctx.fillText(l2,W/2,by+232);
  ctx.shadowBlur=0;

  // her motto — the part no other woman gets
  ctx.fillStyle='#DED7C6';
  ctx.font='italic 400 39px "Lora", serif';
  wrap('“'+D.motto+'”',W-260).forEach((ln,i)=>ctx.fillText(ln,W/2,912+i*58));

  foot('#B9A87C','#E9C46E');
}

/* ══ B — THE BOUTIQUE CARD: her name on cream, quietly ═════════════════ */
function optB(){
  frame(PAPER);
  // faint linen warmth so the paper is not flat white
  const warm=ctx.createRadialGradient(W/2,320,60,W/2,700,900);
  warm.addColorStop(0,'#FFFDF7');warm.addColorStop(1,'#F4EFE3');
  ctx.fillStyle=warm;ctx.fillRect(40,40,W-80,H-80);

  // gold hairline inside the frame — DEFINITION, not a second emphasis device
  ctx.strokeStyle='#C89A2C';ctx.lineWidth=2;
  ctx.strokeRect(74,74,W-148,H-148);

  brandmark(178,GOLD);

  ctx.textAlign='center';
  ctx.fillStyle=SOFTINK;
  ctx.font='italic 400 40px "Lora", serif';
  ctx.fillText('My style archetype is',W/2,396);

  const fs=fitFont(D.arch,'"DM Serif Display", serif',96,52,W-230);
  ctx.font=fs+'px "DM Serif Display", serif';
  ctx.fillStyle=INK;
  ctx.fillText(D.arch,W/2,516);

  // short rule that hugs the words
  const nw=ctx.measureText(D.arch).width;
  ctx.fillStyle=GOLD;ctx.fillRect(W/2-nw/2,552,nw,3);

  ctx.fillStyle=SOFTINK;
  ctx.font='italic 400 39px "Lora", serif';
  wrap('“'+D.motto+'”',W-280).forEach((ln,i)=>ctx.fillText(ln,W/2,660+i*58));

  // the supporting two, given their proper name
  ctx.fillStyle='#9A8E76';
  ctx.font='600 25px "Jost", sans-serif';ctx.letterSpacing='5px';
  ctx.fillText('WITH NOTES OF',W/2,908);ctx.letterSpacing='0px';
  ctx.fillStyle=SOFTINK;
  ctx.font='40px "DM Serif Display", serif';
  D.notes.forEach((n,i)=>ctx.fillText(n,W/2,972+i*56));

  foot('#8E8474','#B8871C');
}

/* ══ C — THE THREE NOTES: her own stylist language, as a fragrance card ═ */
function optC(){
  frame(LACQUER);
  const face=ctx.createRadialGradient(W/2,300,80,W/2,620,980);
  face.addColorStop(0,'#2e281f');face.addColorStop(.5,'#1d1915');face.addColorStop(1,'#100e0b');
  ctx.fillStyle=face;ctx.fillRect(40,40,W-80,H-80);

  brandmark(152,'#C9B37A');

  ctx.textAlign='center';
  ctx.fillStyle='#B7A47A';
  ctx.font='600 26px "Jost", sans-serif';ctx.letterSpacing='6px';
  ctx.fillText('MY STYLE HAS NOTES OF',W/2,412);ctx.letterSpacing='0px';

  const fs=fitFont(D.arch,'"DM Serif Display", serif',94,52,W-220);
  ctx.font=fs+'px "DM Serif Display", serif';
  ctx.fillStyle=diag(W/2-320,512,W/2+320,602,GOLDLEAF);
  ctx.fillText(D.arch,W/2,562);

  star(W/2,632,15,'#C89A2C');

  ctx.fillStyle='#DED7C6';
  ctx.font='52px "DM Serif Display", serif';
  D.notes.forEach((n,i)=>ctx.fillText(n,W/2,714+i*72));

  // hairline, then her motto
  ctx.fillStyle='rgba(200,154,44,.55)';ctx.fillRect(W/2-170,838,340,2);

  ctx.fillStyle='#CFC7B4';
  ctx.font='italic 400 38px "Lora", serif';
  wrap('“'+D.motto+'”',W-280).forEach((ln,i)=>ctx.fillText(ln,W/2,932+i*56));

  foot('#B9A87C','#E9C46E');
}

window.drawOption=function(o){
  ctx.clearRect(0,0,W,H);
  ctx.textBaseline='alphabetic';
  if(o==='A')optA();else if(o==='B')optB();else optC();
};
</script>
